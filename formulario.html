<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
    <header>
        <h1>Formularios</h1>
    </header>

    <main>
        <form class="formulario">
            <label for="nombre">Tu nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">

            <label for="email">Tu email:</label>
            <input type="text" id="email" name="email" placeholder="Correro electrónico">

            <label for="telefono">Tu teléfono</label>
            <input type="number" id="telefono" name="telefono" placeholder="Teléfono" minlength="9">

            <textarea name="mensaje" id="mensaje" rows="10" cols="30">Tu mensaje</textarea>

            <select name="pais" id="pais">
                <option value="españa" selected>España</option>
                <option value="francia">Francia</option>
                <option value="inglaterra">Inglaterra</option>
                <option value="portugal">Portugal</option>
                <option value="italia">Italia</option>
            </select>

            <input type="submit" value="Enviar">
        </form>
    </main>
</body>
</html>
