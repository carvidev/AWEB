<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./multimedia.css">
    <title>Multimedia</title>
</head>
<body>
    <header>
    <h1>Elementos multimedia</h1>
    </header>
    <main>
        <section>
            <div class="bloque">
                <h3>Vídeos online</h3>
                <iframe src="https://www.youtube.com/embed/t-scHKetq7I?si=wuKFWzb9ush220y1" title="Música violonchelo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <iframe title="video-vimeo" src="https://player.vimeo.com/video/401102477?h=ce693d66c6" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
            </div>

            <div class="bloqueVideo">
                <h3>Vídeos en local</h3>
                <video loop controls muted>
                    <source src="./Imágenes/video-en-local.mp4" type="video/mp4">
                    Tu navegador no es capaz de reproducir este vídeo
                </video>
            </div>

            <div class="bloqueAudio">
                <h3>Audios</h3>
                <audio loop controls>
                    <source src="./Imágenes/for The Birds - (Sound design remake).mp3" type="audio/mp3">
                </audio>
            </div>
        </section>

        <section>B</section>
        <section>C</section>
    </main>
    <footer>
        <h3>Web de Servicios Multimedia</h3>
    </footer>
</body>
</html>
